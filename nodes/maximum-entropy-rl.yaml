title: Maximum Entropy RL
cluster: reinforcement
year: 2017
summary: >
  Add the policy's entropy to the objective, so it is paid to stay as
  random as the returns allow. Exploration stops being a schedule bolted
  on the outside and becomes part of what is optimised.
