title: Behavior Cloning
cluster: reinforcement
year: 1988
aka: [Behaviour cloning, Imitation learning]
summary: >
  Fit a policy to demonstrations with a supervised loss and skip the
  reward entirely. Its own small errors then take it off the states it was
  shown, where nothing in the data says what to do. That compounding
  drift is the failure DAgger names and patches.
wikipedia: https://en.wikipedia.org/wiki/Imitation_learning
