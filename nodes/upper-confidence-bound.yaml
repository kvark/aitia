title: Upper Confidence Bound
cluster: reinforcement
year: 2002
aka: [UCB, UCB1]
summary: >
  Pick the arm with the highest optimistic estimate: its mean plus a term
  that grows the less it has been tried. Exploration follows from
  uncertainty rather than from a coin flip, and the regret grows with the
  logarithm of time where a fixed exploration rate makes it linear.
refs:
