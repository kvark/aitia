title: Vision Transformer
cluster: representation
year: 2020
aka: [ViT]
summary: >
  Cuts an image into fixed patches, embeds each as a token and runs a
  plain transformer. Discards the convolutional priors entirely, and beats
  them once the data is large enough to replace them.
