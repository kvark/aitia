title: Epsilon-Greedy
cluster: reinforcement
aka: ["ε-greedy"]
summary: >
  Take the best action known, except on an ε fraction of steps where the
  action is uniformly random. The cheapest exploration that still visits
  every action infinitely often, and the baseline anything cleverer has to
  beat.
wikipedia: https://en.wikipedia.org/wiki/Multi-armed_bandit
refs:
