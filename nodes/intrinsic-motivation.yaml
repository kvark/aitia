title: Intrinsic Motivation
cluster: reinforcement
year: 2017
aka: [Curiosity, ICM, Random Network Distillation, RND]
summary: >
  Pay the agent for reaching states its own predictor gets wrong, so
  novelty becomes a reward it can follow. What Montezuma's Revenge needed
  and what undirected exploration was never going to supply.
refs:
