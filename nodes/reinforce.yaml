title: REINFORCE
cluster: reinforcement
year: 1992
aka: [Score function estimator, Likelihood ratio method]
summary: >
  Scale each action's log-probability gradient by the return that followed
  it. The whole policy-gradient family starts here, and so does its
  variance problem: one lucky episode is indistinguishable from a better
  action.
refs:
  - title: Simple statistical gradient-following algorithms for connectionist reinforcement learning
    authors: Williams
    year: 1992
    url: https://link.springer.com/article/10.1007/BF00992696
edges:
  - rel: specializes
    to: policy-gradient
    why: the coefficient is the episode's own return, with nothing subtracted
  - rel: requires
    to: monte-carlo-integration
    why: the gradient is an expectation over trajectories it can only sample
