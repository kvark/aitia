title: Variational Autoencoder
cluster: generative
year: 2013
aka: [VAE]
summary: >
  Learns an encoder to a latent distribution and a decoder back, trained
  on a lower bound of the likelihood. Gives a latent space you can
  interpolate in, at the cost of blurry samples.
wikipedia: https://en.wikipedia.org/wiki/Variational_autoencoder
refs:
